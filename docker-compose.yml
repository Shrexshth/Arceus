version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arceus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  trueforge:
    image: trueforge/trueforge:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=arceus
    depends_on:
      - db

volumes:
  pgdata:
